server {
    listen 8080;
    server_name salu.com;
    root /home/nfenollo/repo/webserv;
    error_page 403 www/errors/403.html;

    # ---------------------------------------
    # /
    # GET only
    # ---------------------------------------
    location / {
        root /home/nfenollo/repo/webserv/www;
        index /index.html;
        allow_methods GET;
    }

    location /readonly/ {
        index index.html;
        allow_methods GET;
    }

    location /list/ {
        root /home/nfenollo/repo/webserv/www;
        index falsh;
        autoindex on;
    }

    # ---------------------------------------
    # /post_body
    # POST only
    # Max body size = 100
    # ---------------------------------------
    location /post_body {
        allow_methods POST;
        allow_upload on;
        client_max_body_size 100;
        upload_store /home/nfenollo/repo/webserv/www;
    }

    location /post_photo {
        allow_methods POST;
        allow_upload on;
        upload_store /home/nfenollo/repo/webserv/www;
    }

    location /old/ {
		return 301 /list;
	}

    # ---------------------------------------
    # /directory/
    # GET only
    # Root = YoupiBanane
    # Default file = youpi.bad_extension
    # ---------------------------------------
    location /directory/ {
        allow_methods GET POST;
        root /home/nfenollo/repo/webserv/YoupiBanane/;
        index youpi.bad_extension;
        
        cgi_extension .bla;
        cgi_path /home/nfenollo/repo/webserv/cgi-bin/cgi_tester;
    }

    location *.oui {
        allow_methods POST GET;

        cgi_extension .oui;
        cgi_path /home/nfenollo/repo/webserv/test/test.py;
    }

    location *.non {
        allow_methods POST GET;

        cgi_extension .non;
        cgi_path /home/nfenollo/repo/webserv/test/testcrash.py;
    }

    location *.sleep {
        allow_methods POST GET;

        cgi_extension .sleep;
        cgi_path /home/nfenollo/repo/webserv/test/test_sleep.py;
    }

    location *.bla {
        allow_methods POST GET;

        cgi_extension .bla;
        cgi_path /home/nfenollo/repo/webserv/cgi-bin/cgi_tester;
    }

    location *.php {
        allow_methods POST GET;
        root /home/nfenollo/repo/webserv/;
        cgi_extension .php;
        cgi_path /bin/php-cgi;
    }

    # location /wordpress/ {
    #     root /home/nfenollo/repo/webserv/wordpress;
    #     allow_methods GET;
    #     index index.php;
    # }


}